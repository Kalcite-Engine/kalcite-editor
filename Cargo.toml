[package]
name = "kalcite-editor"
version = "0.14.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Native graphical editor for Kalcite projects"
repository = "https://github.com/Kalcite-Engine/kalcite-editor"

[[bin]]
name = "kalcite-editor"
path = "src/main.rs"

[[bin]]
name = "kalcite-editor-info"
path = "src/info_builder.rs"

[build-dependencies]
kalcite-syntax = { git = "https://github.com/Kalcite-Engine/kalcite.git", rev = "29803c0345637487b8a257f8f3bbb27680163465" }
kalcite-hir = { git = "https://github.com/Kalcite-Engine/kalcite.git", rev = "29803c0345637487b8a257f8f3bbb27680163465" }
kalcite-mir = { git = "https://github.com/Kalcite-Engine/kalcite.git", rev = "29803c0345637487b8a257f8f3bbb27680163465" }
kalcite-backend-rust = { git = "https://github.com/Kalcite-Engine/kalcite.git", rev = "29803c0345637487b8a257f8f3bbb27680163465" }

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kalcite-project = { git = "https://github.com/Kalcite-Engine/kalcite.git", rev = "29803c0345637487b8a257f8f3bbb27680163465" }
kalcite-scene = { git = "https://github.com/Kalcite-Engine/kalcite.git", rev = "29803c0345637487b8a257f8f3bbb27680163465" }
kalcite-linter = { git = "https://github.com/Kalcite-Engine/kalcite.git", rev = "29803c0345637487b8a257f8f3bbb27680163465" }
kalcite-assets = { git = "https://github.com/Kalcite-Engine/kalcite.git", rev = "29803c0345637487b8a257f8f3bbb27680163465" }
kalcite-profiler = { git = "https://github.com/Kalcite-Engine/kalcite.git", rev = "29803c0345637487b8a257f8f3bbb27680163465" }
