[package]
name = "kalcite-editor"
version = "0.14.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Native graphical editor for Kalcite projects"
repository = "https://github.com/Kalcite-Engine/kalcite-editor"

[[bin]]
name = "kalcite-editor"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
kalcite-project = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-scene = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-linter = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-assets = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
kalcite-profiler = { git = "https://github.com/Kalcite-Engine/kalcite.git", tag = "v0.14.0" }
