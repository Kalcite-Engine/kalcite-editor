name: Editor CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: editor-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: make install DESTDIR="$PWD/.stage" PREFIX=/usr
      - run: test -x .stage/usr/bin/kalcite-editor && test -f .stage/usr/share/applications/kalcite-editor.desktop
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v20
      - run: nix build .#kalcite-editor
